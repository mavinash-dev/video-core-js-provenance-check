name: core-new.yml
on:
  workflow_call:
    inputs:
      file-to-upload:
        required: false
        type: string
      s3-path:
        required: false
        type: string
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  publish_and_deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Get Package Version
      id: package-version
      run: |
        PACKAGE_VERSION=$(jq -r '.version' package.json)
        echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV
        echo "package-version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
        echo "release-tag=v$PACKAGE_VERSION" >> $GITHUB_OUTPUT
        if echo "$PACKAGE_VERSION" | grep -q "beta"; then
          echo "NPM_TAG=beta" >> $GITHUB_ENV
        else
          echo "NPM_TAG=latest" >> $GITHUB_ENV
        fi

    # A published release is immutable, so a version that is already released cannot be redone.
    # A draft left by an earlier failed run can be, so it is deleted and rebuilt.
    - name: Stop if this version is already released
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG_NAME: v${{ env.PACKAGE_VERSION }}
      run: |
        EXISTING=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate | jq -r --arg t "$TAG_NAME" '.[] | select(.tag_name == $t) | "\(.id) \(.draft)"')
        if [ -z "$EXISTING" ]; then
          echo "No release for $TAG_NAME yet."
          exit 0
        fi
        read -r ID DRAFT <<< "$EXISTING"
        if [ "$DRAFT" != "true" ]; then
          echo "::error::$TAG_NAME is already released and cannot be changed. Bump the version and release again."
          exit 1
        fi
        echo "Deleting the leftover draft for $TAG_NAME from an earlier failed run."
        gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$ID"

    - name: Generate integrity manifest
      if: ${{ inputs.file-to-upload != '' || github.event_name == 'workflow_call' }}
      env:
        DIST_FILE: ${{ inputs.file-to-upload }}
        RELEASE_TAG: v${{ env.PACKAGE_VERSION }}
      run: |
        mkdir -p "$RUNNER_TEMP/integrity"
        node .github/scripts/generate-integrity-manifest.mjs \
          "$RUNNER_TEMP/integrity/integrity-manifest.json" \
          "$RUNNER_TEMP/integrity/SHA256SUMS" \
          "$RELEASE_TAG" "$GITHUB_SHA"

    - name: Attest build provenance
      if: ${{ inputs.file-to-upload != '' || github.event_name == 'workflow_call' }}
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-checksums: ${{ runner.temp }}/integrity/SHA256SUMS

    - name: Attest manifest and checksums
      if: ${{ inputs.file-to-upload != '' || github.event_name == 'workflow_call' }}
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: |
          ${{ runner.temp }}/integrity/SHA256SUMS
          ${{ runner.temp }}/integrity/integrity-manifest.json

    - name: Verify checksums and attestations
      if: ${{ inputs.file-to-upload != '' || github.event_name == 'workflow_call' }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DIST_FILE: ${{ inputs.file-to-upload }}
      run: |
        # The built file is attested under its S3 names, so it is checked by digest.
        # This workflow is shared: when an agent repo calls it, the signer is still this file in video-core-js.
        EXPECTED=$(sha256sum "$DIST_FILE" | cut -d' ' -f1)
        grep -q "^$EXPECTED  " "$RUNNER_TEMP/integrity/SHA256SUMS"
        for f in "$DIST_FILE" "$RUNNER_TEMP/integrity/SHA256SUMS" "$RUNNER_TEMP/integrity/integrity-manifest.json"; do
          gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" --signer-workflow "mavinash-dev/video-core-js-provenance-check/.github/workflows/core-new.yml"
        done

    # A re-run after a later failure must not fail here because the version is already on npm.
    - name: Publish to NPM
      env:
        NPM_PUBLISH_TAG: ${{ env.NPM_TAG }}
      run: |
        # Shared workflow: the package is the calling repo's, not always @newrelic/video-core.
        PKG=$(jq -r .name package.json)
        if npm view "${PKG}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
          echo "${PKG}@${PACKAGE_VERSION} is already on npm, skipping publish."
        else
          echo "WOULD PUBLISH ${PKG:-@newrelic/video-core}@${PACKAGE_VERSION}"
        fi

